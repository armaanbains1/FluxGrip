[env:upesy_wrover]
platform = espressif32
board = upesy_wrover
framework = arduino
monitor_speed = 115200

; 1. Keep your source file filters
build_src_filter = -<test.cpp> +<main.cpp> +<i2cSensor.cpp> +<i2cSensor.h> +<kinematicsEngine.h> +<kinematicsEngine.cpp> +<engineClock.h> +<engineClock.cpp> +<workoutEngine.h> +<workoutEngine.cpp>

; 2. Add your dependencies + point PlatformIO to your downloaded Edge Impulse library
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    ; If you placed the extracted Edge Impulse folder or ZIP inside your /lib directory:
    ; fluxGrip_inferencing 

; 3. Enable C++11/C++14 and essential Edge Impulse build flags
build_flags = 
    -std=c++14
    -D_GNU_SOURCE
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue